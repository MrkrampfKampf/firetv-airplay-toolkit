name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      # Submodules are not needed to lint PowerShell, so skip them for speed.
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -Repository PSGallery

      - name: Analyze scripts
        shell: pwsh
        run: |
          $findings = Invoke-ScriptAnalyzer `
            -Path ./scripts -Recurse `
            -Settings ./PSScriptAnalyzerSettings.psd1 `
            -Severity Error, Warning
          if ($findings) {
            $findings | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
            throw "$($findings.Count) PSScriptAnalyzer finding(s)."
          }
          Write-Host 'No PSScriptAnalyzer findings.'

      - name: Check every script parses
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem ./scripts -Filter *.ps1 -Recurse) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$null, [ref]$errors)
            if ($errors) {
              $failed = $true
              Write-Host "FAIL $($file.Name)"
              $errors | ForEach-Object { Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)" }
            } else {
              Write-Host "OK   $($file.Name)"
            }
          }
          if ($failed) { throw 'One or more scripts failed to parse.' }
